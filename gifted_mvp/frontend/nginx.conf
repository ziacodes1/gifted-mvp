# SPA + reverse proxy. TLS is expected to terminate in front of this (platform / load balancer),
# which must forward X-Forwarded-Proto so Django knows the request was HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;  # diary photos are limited to 5 MB by the API
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;  # AI calls have their own shorter timeout + fallback
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
